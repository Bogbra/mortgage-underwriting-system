services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: underwriting
      POSTGRES_USER: underwriting
      POSTGRES_PASSWORD: underwriting
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U underwriting"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Demo mode by default — no API key required. Set LLM_PROVIDER=openai
      # and OPENAI_API_KEY (below) for a live run. See ADR 0003.
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fake}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DATABASE_URL: postgresql+psycopg://underwriting:underwriting@postgres:5432/underwriting
      CHROMA_PERSIST_DIR: /app/data/chroma
      POLICY_DOCUMENT_PATH: /app/data/policies/underwriting_policies.md
      API_BEARER_TOKEN: ${API_BEARER_TOKEN:-dev-local-token}
      REVIEWER_BEARER_TOKEN: ${REVIEWER_BEARER_TOKEN:-dev-reviewer-token}
      CORS_ALLOW_ORIGINS: '["http://localhost:3000"]'
    volumes:
      - chroma_data:/app/data/chroma
    ports:
      - "8000:8000"

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    depends_on:
      - api
    environment:
      BACKEND_API_URL: http://api:8000
      BACKEND_API_TOKEN: ${API_BEARER_TOKEN:-dev-local-token}
      BACKEND_REVIEWER_TOKEN: ${REVIEWER_BEARER_TOKEN:-dev-reviewer-token}
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  chroma_data:

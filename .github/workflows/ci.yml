name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, tests, evals)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --extra dev --extra mcp --frozen

      - name: Lint (ruff)
        run: uv run ruff check src tests

      - name: Unit + integration tests
        run: uv run pytest tests -q

      - name: Golden-case decision evals (offline fake model)
        run: uv run python -m underwriting.evals.run

      - name: RAG eval smoke test (offline fake model + embeddings)
        # Proves the harness runs end to end (all 4 phases) with no API
        # key. Not a quality gate — fake embeddings/LLM produce numbers
        # that aren't meaningful, see rag_eval.py's own warnings. Real
        # retrieval/groundedness numbers need --provider openai
        # --embeddings openai, which costs money and isn't deterministic
        # enough to gate CI on — see docs/adr/0007-rag-evaluation.md.
        run: uv run python -m underwriting.evals.rag_eval

  frontend:
    name: Frontend (typecheck, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build (runs ESLint as part of the production build)
        run: npm run build
